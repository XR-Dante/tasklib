services:
  nginx:
    image: "nginx:stable-alpine"
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: dockerFiles
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  mysql:
    image:  mysql:8.0
    container_name: mysql
    platform: linux/amd64
    restart: always
    ports:
      - "3316:3306"
    env_file:
      - .env
    volumes:
    - mysql_data:/var/lib/mysql

volumes:
  mysql_data: 

